<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String to Array Example</title>
</head>
<body>

    
    <p id="k"></p>

    <script>
       const j = "javscript is owsome";
       const y = j.split(" "); 
       document.getElementById("k").innerHTML = y.join(", ");
    </script>

</body>
</html>
